<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资产负债结构分析</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js + datalabels -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<!-- Noto Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 顶部导航栏 -->
<header class="nav-bar">
    <div class="nav-inner">
        <div class="nav-brand">
            <div class="nav-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 3v18h18"/><path d="M7 16V9M12 16V5M17 16v-4"/>
                </svg>
            </div>
            <div>
                <h1>资产负债结构分析</h1>
                <p class="nav-desc">上传 Excel 资产负债表，自动生成 16 项分组柱状图</p>
            </div>
        </div>
        <div class="nav-status" id="navStatus">
            <span class="status-dot"></span><span class="status-text">就绪</span>
        </div>
    </div>
</header>

<main class="container">

    <!-- 上传区 -->
    <section class="upload-section" id="uploadSection">
        <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept=".xlsx" hidden>
            <div class="dropzone-inner">
                <div class="dropzone-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="dropzone-title">拖拽 Excel 文件到此处</p>
                <p class="dropzone-hint">或 <span class="link">点击选择文件</span> · 仅支持 .xlsx</p>
                <div class="file-info" id="fileInfo" hidden>
                    <div class="file-chip">
                        <svg class="file-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span id="fileName">—</span>
                    </div>
                    <button class="btn-primary" id="uploadBtn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                        开始分析
                    </button>
                </div>
            </div>
            <div class="dropzone-overlay" id="dropOverlay"></div>
        </div>
        <div class="error-box" id="errorBox" hidden></div>
        <div class="loading-bar" id="loadingBar" hidden>
            <div class="loading-fill"></div>
            <span class="loading-text">正在解析数据…</span>
        </div>
    </section>

    <!-- 结果区 -->
    <section class="result-section" id="resultSection" hidden>

        <!-- 图表卡片 -->
        <div class="card chart-card">
            <div class="card-header">
                <div>
                    <h2 class="card-title" id="chartTitle">资产负债结构</h2>
                    <p class="card-sub" id="chartSub"></p>
                </div>
                <div class="legend">
                    <span class="legend-item asset"><i></i>资产侧 (9项)</span>
                    <span class="legend-item liab"><i></i>负债侧 (7项)</span>
                </div>
            </div>
            <div class="chart-wrap">
                <canvas id="chartCanvas"></canvas>
            </div>
            <div class="chart-footer">
                单位：亿元 ｜ 共 <strong id="rawCount">0</strong> 条原始科目 ｜ 合计 <strong id="totalVal">0</strong> 亿元
            </div>
        </div>

        <!-- 数据表格 -->
        <div class="tables-grid">
            <div class="card table-card">
                <div class="card-header table-header asset-header">
                    <h3 class="table-title">资产侧</h3>
                    <span class="table-sum" id="assetSum">0 亿元</span>
                </div>
                <div class="table-body" id="assetTable"></div>
            </div>
            <div class="card table-card">
                <div class="card-header table-header liab-header">
                    <h3 class="table-title">负债侧</h3>
                    <span class="table-sum" id="liabSum">0 亿元</span>
                </div>
                <div class="table-body" id="liabTable"></div>
            </div>
        </div>

        <!-- JSON 折叠区 -->
        <div class="card json-card">
            <button class="json-toggle" id="jsonToggle">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
                <span>原始 JSON 数据</span>
                <span class="json-hint">点击展开/收起</span>
            </button>
            <pre class="json-content" id="jsonContent" hidden></pre>
        </div>

    </section>
</main>

<footer class="footer">
    <p>Finance Agent · 资产负债表 16 项分组可视化 · 基于 FastAPI + Chart.js</p>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
